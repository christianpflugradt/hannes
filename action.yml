name: Hannes
description: Install an exact Hannes release and optionally run an execution point
inputs:
  version:
    description: Exact stable Hannes release tag, such as v0.13.0
    required: true
  execution-point:
    description: Execution point to run in the consuming repository
    required: false
    default: check
  run:
    description: Execute Hannes after installation (true or false)
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install Hannes
      shell: bash
      env:
        HANNES_VERSION: ${{ inputs.version }}
        HANNES_RUN: ${{ inputs.run }}
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: bash "$ACTION_DIRECTORY/scripts/install-action.sh"
    - name: Run Hannes
      if: inputs.run == 'true'
      shell: bash
      env:
        HANNES_EXECUTION_POINT_INPUT: ${{ inputs.execution-point }}
      run: hannes mach was --at "$HANNES_EXECUTION_POINT_INPUT"
