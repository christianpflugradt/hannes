name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release verifies push access even during a dry run
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      initial: ${{ steps.plan.outputs.initial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Plan next semantic release without publishing
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:plan

  checks:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  quality:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/quality.yml
    with:
      release-version: ${{ needs.plan.outputs.version }}

  publish:
    needs: [plan, checks, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Read the exact governor release pin
        id: governor
        shell: bash
        run: echo "version=$(cat .hannes-version)" >> "$GITHUB_OUTPUT"
      - name: Install published Hannes through the public Action
        if: runner.os == 'Linux'
        uses: christianpflugradt/hannes@c1bedc737c8d8f0a746cd964923c67ac5d60d976 # initial public Action publication
        with:
          version: ${{ steps.governor.outputs.version }}
          execution-point: check
          run: 'false'
      - name: Reconcile declared Git hooks and external rules
        run: hannes pass auf --auto-approve
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hannes-*
          path: dist
          merge-multiple: true
      - name: Checksum all native archives
        run: python3 scripts/checksums.py
      - name: Verify collected release artifacts through Hannes
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python3 scripts/run-execution-point.py release-artifacts
      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-release-artifacts
          path: .hannes/reports/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Install pinned Gitleaks for security checks
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Prepare managed release hooks
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          cargo +stable fetch --locked
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 fetch --locked
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Publish versioned CLI archives and release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          INITIAL_RELEASE: ${{ needs.plan.outputs.initial }}
        run: npm run release
      - name: Upload release hook evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-release-hooks
          path: .hannes/reports/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
