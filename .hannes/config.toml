project = "hannes"
max_display_files = 5

[execution_points]
custom = ["release-build", "release-artifacts"]

[[imports]]
git = "https://github.com/christianpflugradt/christianpflugradt-rulesets.git"
path = "commit-msg/conventional-commits"
ref = "e1d7aadc0f46617835534c5fb067c42123b26f55"

[imports.rule_parameters.commit-message]
scopes_file = ".hannes/commit-scopes.txt"

[[imports]]
git = "https://github.com/christianpflugradt/christianpflugradt-rulesets.git"
path = "multi-point/security"
ref = "6222443fa71627c55bada9d7f80e5595d45ef880"
