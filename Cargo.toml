[package]
name = "hannes"
version = "0.1.0"
edition = "2024"
description = "A small, agent-agnostic governance meta-harness"
license = "Unlicense"
rust-version = "1.85"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
