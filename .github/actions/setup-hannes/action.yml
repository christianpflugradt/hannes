name: Install published Hannes
description: Install the exact release in .hannes-version without building source
runs:
  using: composite
  steps:
    - name: Install checksum-verified governor
      shell: bash
      run: python3 scripts/install-governor.py
    - name: Reconcile declared Git hooks
      shell: bash
      run: '"$HANNES_EXECUTABLE" pass auf --auto-approve'
