[[rule_sets]]
id = "tooling-regressions"
enabled = true
rules = ["03-docs-tests", "04-governance-tests", "05-hooks-tests", "06-deploy-tests", "07-release-tests", "08-release-rules"]
run_at = ["pre-push", "ci-tooling"]

[[rule_sets]]
id = "native-validation"
enabled = true
rules = ["10-clippy", "11-rust-tests", "12-native-build", "13-native-smoke"]
run_at = ["pre-push", "ci-native"]

[[rule_sets]]
id = "dependency-audits"
enabled = true
rules = ["24-rust-audit", "25-npm-audit"]
run_at = ["ci-audit"]
